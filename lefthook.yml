pre-commit:
  # Sequential: formatting rewrites staged files before lint and vet read them.
  piped: true
  commands:
    go-format:
      priority: 1
      glob: "*.go"
      # gofmt -s and goimports (local prefix) through the pinned golangci-lint formatters.
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 fmt {staged_files}
      stage_fixed: true
    go-lint:
      priority: 2
      glob: "*.go"
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
    go-vet:
      priority: 3
      glob: "*.go"
      run: go vet ./...
    frontend:
      priority: 4
      glob: "*.{ts,tsx,css}"
      run: npm --prefix frontend run lint
commit-msg:
  commands:
    conventional:
      run: node frontend/node_modules/@commitlint/cli/cli.js --edit {1}
pre-push:
  parallel: true
  commands:
    go-format-check:
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 fmt --diff ./...
    go-test:
      run: go test -timeout 90s ./...
    typecheck:
      run: npm --prefix frontend run typecheck
    vulnerabilities:
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
